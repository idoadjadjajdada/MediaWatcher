<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Helxis — cosmic sandbox</title>
<meta name="description" content="An N-body physics sandbox: real gravity, real collisions, pixel worlds that melt and mix.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23161127'/%3E%3Cpath d='M7 5v14M17 5v14M7 12h10' stroke='%23a78bfa' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<canvas id="stage" aria-label="Simulation viewport"></canvas>

<!-- ── top left: identity ─────────────────────────────────────────────── -->
<div class="panel brand" id="brand">
  <div class="brand-mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="22" height="22" shape-rendering="crispEdges">
      <path d="M6 4v16M18 4v16M6 12h12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"/>
    </svg>
  </div>
  <div class="brand-text">
    <div class="brand-name">HELXIS</div>
    <div class="brand-sub">COSMIC SANDBOX // V0.1</div>
  </div>
</div>

<!-- ── top: time transport ────────────────────────────────────────────── -->
<div class="panel transport" id="transport">
  <button class="icon-btn" id="time-slower" title="Slower (,)" aria-label="Slower">
    <svg viewBox="0 0 16 16" width="14" height="14"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"/></svg>
  </button>
  <button class="icon-btn primary" id="time-play" title="Play / pause (space)" aria-label="Play or pause">
    <svg id="icon-pause" viewBox="0 0 16 16" width="14" height="14"><path d="M5 3v10M11 3v10" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"/></svg>
    <svg id="icon-play" viewBox="0 0 16 16" width="14" height="14" hidden><path d="M5 3l8 5-8 5z" fill="currentColor"/></svg>
  </button>
  <button class="icon-btn" id="time-faster" title="Faster (.)" aria-label="Faster">
    <svg viewBox="0 0 16 16" width="14" height="14"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"/></svg>
  </button>

  <select id="time-scale" class="select compact" aria-label="Time scale"></select>

  <button class="icon-btn" id="time-step" title="Step forward one frame" aria-label="Step forward">
    <svg viewBox="0 0 16 16" width="14" height="14"><path d="M4 3l6 5-6 5z" fill="currentColor"/><path d="M12 3v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/></svg>
  </button>

  <div class="clock" id="clock">T + 00:00:00</div>

  <button class="icon-btn" id="time-reset" title="Restart this system" aria-label="Restart">
    <svg viewBox="0 0 16 16" width="14" height="14"><path d="M13 8a5 5 0 1 1-1.8-3.8M13 2v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/></svg>
  </button>
</div>

<!-- ── top centre: presets ────────────────────────────────────────────── -->
<select id="preset-select" class="select preset-select" aria-label="Load preset system"></select>

<!-- ── top right: file and settings ───────────────────────────────────── -->
<div class="panel topright" id="topright">
  <button class="text-btn" id="btn-save">Save</button>
  <button class="text-btn" id="btn-load">Load</button>
  <button class="round-btn" id="btn-help" title="Keyboard shortcuts (?)" aria-label="Help">?</button>
  <button class="round-btn" id="btn-settings" title="Settings" aria-label="Settings">
    <svg viewBox="0 0 16 16" width="15" height="15"><circle cx="8" cy="8" r="2.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.1 3.1l1.4 1.4M11.5 11.5l1.4 1.4M12.9 3.1l-1.4 1.4M4.5 11.5l-1.4 1.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="square"/></svg>
  </button>
</div>

<!-- ── left: body picker ──────────────────────────────────────────────── -->
<section class="panel picker" id="picker">
  <header class="panel-head">
    <div>
      <div class="eyebrow">Celestial</div>
      <h1 class="panel-title">Body Picker</h1>
    </div>
    <button class="icon-btn ghost" id="picker-collapse" title="Collapse" aria-label="Collapse panel">
      <svg viewBox="0 0 16 16" width="14" height="14"><path d="M4 8h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"/></svg>
    </button>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="objects" role="tab">Objects <span class="tab-count" id="count-objects">00</span></button>
    <button class="tab" data-tab="presets" role="tab">Presets <span class="tab-count" id="count-presets">00</span></button>
  </div>

  <div class="picker-body" id="tab-objects">
    <div class="search">
      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><circle cx="7" cy="7" r="4.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.2 10.2 14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="square"/></svg>
      <input type="search" id="search" placeholder="Find a celestial object…" aria-label="Search objects" autocomplete="off">
      <kbd>/</kbd>
    </div>
    <div class="chips" id="chips"></div>
    <div class="list" id="object-list" role="listbox" aria-label="Celestial objects"></div>
  </div>

  <div class="picker-body" id="tab-presets" hidden>
    <div class="list" id="preset-list" role="listbox" aria-label="Preset systems"></div>
  </div>

  <footer class="placement">
    <div class="eyebrow">Placement</div>
    <label class="check">
      <input type="checkbox" id="auto-orbit" checked>
      <span>Auto-orbit nearest body</span>
    </label>
    <label class="slider-row">
      <span class="slider-label">Mass</span>
      <input type="range" id="mass-scale" min="-3" max="3" step="0.05" value="0">
      <output id="mass-scale-value">1×</output>
    </label>
  </footer>
</section>

<!-- ── right: inspector ───────────────────────────────────────────────── -->
<aside class="panel inspector" id="inspector" hidden>
  <header class="inspector-head">
    <div class="eyebrow">Body inspector</div>
    <button class="icon-btn ghost" id="inspector-close" aria-label="Close inspector">
      <svg viewBox="0 0 16 16" width="13" height="13"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/></svg>
    </button>
  </header>
  <div class="inspector-id">
    <canvas class="thumb" id="inspector-thumb" width="44" height="44"></canvas>
    <div>
      <div class="inspector-name" id="inspector-name">—</div>
      <div class="inspector-kind" id="inspector-kind">—</div>
    </div>
  </div>
  <dl class="stat-grid" id="inspector-stats"></dl>
  <div class="composition">
    <div class="eyebrow">Composition</div>
    <div id="composition-rows"></div>
  </div>
  <div class="inspector-actions">
    <button class="text-btn" id="btn-follow">◎ Follow body</button>
    <button class="text-btn danger" id="btn-delete-body">Delete</button>
  </div>
</aside>

<!-- ── bottom: tools ──────────────────────────────────────────────────── -->
<div class="tool-hint" id="tool-hint"></div>
<div class="panel dock" id="dock">
  <div class="tool-row" id="tool-row" role="toolbar" aria-label="Tools"></div>
  <div class="dock-sep"></div>
  <div class="intensity">
    <span class="eyebrow">Intensity</span>
    <input type="range" id="intensity" min="0" max="2" step="0.05" value="1" aria-label="Tool intensity">
    <output id="intensity-value">1.0</output>
  </div>
</div>

<!-- ── bottom right: view controls + radar ────────────────────────────── -->
<div class="panel viewbar" id="viewbar">
  <span class="viewbar-label" id="view-mode">TOP DOWN</span>
  <button class="icon-btn" id="rot-ccw" title="Rotate left (Q)" aria-label="Rotate left">
    <svg viewBox="0 0 16 16" width="13" height="13"><path d="M3 8a5 5 0 1 0 1.8-3.8M3 2v3h3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="square"/></svg>
  </button>
  <button class="icon-btn" id="rot-cw" title="Rotate right (E)" aria-label="Rotate right">
    <svg viewBox="0 0 16 16" width="13" height="13"><path d="M13 8a5 5 0 1 1-1.8-3.8M13 2v3h-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="square"/></svg>
  </button>
  <button class="icon-btn" id="zoom-out" aria-label="Zoom out">−</button>
  <span class="viewbar-zoom" id="zoom-label">100%</span>
  <button class="icon-btn" id="zoom-in" aria-label="Zoom in">+</button>
  <button class="icon-btn" id="recenter" title="Frame everything (F)" aria-label="Frame everything">
    <svg viewBox="0 0 16 16" width="13" height="13"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2" stroke="currentColor" stroke-width="1.3" stroke-linecap="square"/></svg>
  </button>
</div>

<section class="panel radar" id="radar">
  <div class="eyebrow">Tactical radar</div>
  <canvas id="radar-canvas" width="164" height="164"></canvas>
</section>

<!-- ── bottom left: status ────────────────────────────────────────────── -->
<div class="status" id="status">
  <span class="status-dot" id="status-dot"></span>
  <span id="status-state">SIMULATING</span>
  <span class="status-sep"></span>
  <span id="status-bodies">0 bodies</span>
  <span class="status-sep"></span>
  <span id="status-fps">0 FPS</span>
  <span class="status-sep diag" hidden></span>
  <span id="status-diag" class="diag" hidden></span>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<!-- ── settings drawer ────────────────────────────────────────────────── -->
<aside class="panel drawer" id="settings-drawer" hidden>
  <header class="panel-head">
    <div>
      <div class="eyebrow">Simulation</div>
      <h2 class="panel-title">Settings</h2>
    </div>
    <button class="icon-btn ghost" id="settings-close" aria-label="Close settings">
      <svg viewBox="0 0 16 16" width="13" height="13"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/></svg>
    </button>
  </header>
  <div class="drawer-body" id="settings-body"></div>
  <footer class="drawer-foot">
    <button class="text-btn" id="settings-reset">Restore defaults</button>
  </footer>
</aside>

<!-- ── help ───────────────────────────────────────────────────────────── -->
<div class="modal" id="help-modal" hidden>
  <div class="panel modal-card">
    <header class="panel-head">
      <div>
        <div class="eyebrow">Reference</div>
        <h2 class="panel-title">Controls</h2>
      </div>
      <button class="icon-btn ghost" id="help-close" aria-label="Close">
        <svg viewBox="0 0 16 16" width="13" height="13"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/></svg>
      </button>
    </header>
    <div class="help-grid" id="help-grid"></div>
  </div>
</div>

<input type="file" id="file-input" accept="application/json" hidden>
<script type="module" src="./src/main.js"></script>
</body>
</html>
